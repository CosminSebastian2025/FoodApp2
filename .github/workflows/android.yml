name: Release Android

# Si attiva quando pubblichi un tag tipo v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # necessario per creare la GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. Codice sorgente
      - uses: actions/checkout@v4

      # 2. JDK 17 (richiesto da AGP moderno / Jetpack Compose)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Gradle (build molto più veloci)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Rende eseguibile il wrapper (su Linux)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Decodifica il keystore dai secrets (versione robusta per Ubuntu)
      - name: Decode keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r' | base64 --decode > app/fastbite-release.keystore

      # 6. Build firmata: AAB (per Play Store) + APK (per test diretti)
      - name: Build signed release AAB & APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      # 7. Estrae la versione dal tag (v1.2.3 -> 1.2.3)
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 8. Pubblica la release con i file firmati
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FastBite ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk