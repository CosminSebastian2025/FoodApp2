name: Release Android

# Si attiva quando pubblichi un tag (es. v1.0.0) o manualmente da GitHub Actions
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # Necessario per creare la GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. Codice sorgente
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Rende eseguibile il wrapper
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Decodifica il keystore dai secrets di GitHub
      - name: Decode keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r' | base64 --decode > app/fastbite-release.keystore

      # 6. Build firmata: AAB (per Play Store) + APK (per installazione diretta)
      - name: Build signed release AAB & APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      # 7. Estrae il numero di versione dal tag o dal commit
      - name: Extract version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 8. Pubblica la Release su GitHub allegando APK e AAB
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FastBite ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
